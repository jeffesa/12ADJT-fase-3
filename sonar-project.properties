# SonarCloud - Tech Challenge Fase 3 (projeto multi-module)
sonar.organization=jeffesa
sonar.projectKey=jeffesa_12ADJT-fase-3
sonar.projectName=Tech Challenge Fase 3 - Sistema Hospitalar

# Módulos Maven
sonar.modules=scheduling-service,notification-service,history-service

# Fontes e testes (por módulo, herdado pelos submódulos)
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Relatórios de cobertura JaCoCo (XML por módulo)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusões de cobertura: classes sem lógica testável
sonar.coverage.exclusions=\
  **/config/**,\
  **/dto/**,\
  **/*Application.java,\
  **/persistence/*JpaEntity.java

# Encoding
sonar.sourceEncoding=UTF-8
