name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Sem SONAR_TOKEN: só build + testes + check de cobertura
      - name: Build and Test
        if: ${{ env.SONAR_TOKEN == '' }}
        run: mvn -B clean verify

      # Com SONAR_TOKEN: build + testes + análise SonarCloud no mesmo run
      # (o sonar:sonar precisa dos relatórios JaCoCo gerados no verify)
      - name: Build, Test and SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B clean verify sonar:sonar -Dsonar.host.url=https://sonarcloud.io
