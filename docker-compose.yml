version: "3.9"

services:
  # ═══════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════

  postgres-scheduling:
    image: postgres:15
    container_name: fase3-postgres-scheduling
    environment:
      POSTGRES_DB: scheduling_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - fase3_scheduling_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fase3net

  postgres-history:
    image: postgres:15
    container_name: fase3-postgres-history
    environment:
      POSTGRES_DB: history_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
    ports:
      - "5434:5432"
    volumes:
      - fase3_history_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fase3net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fase3-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      TZ: America/Sao_Paulo
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - fase3_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fase3net

  # ═══════════════════════════════════════
  # APPLICATION SERVICES
  # ═══════════════════════════════════════

  scheduling-service:
    build:
      context: .
      dockerfile: scheduling-service/Dockerfile
    container_name: fase3-scheduling-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-scheduling:5432/scheduling_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SERVER_PORT: 8081
      TZ: America/Sao_Paulo
    ports:
      - "8081:8081"
    depends_on:
      postgres-scheduling:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fase3net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: fase3-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SERVER_PORT: 8082
      NOTIFICATION_DLQ_MONITOR_ENABLED: ${NOTIFICATION_DLQ_MONITOR_ENABLED:-true}
      TZ: America/Sao_Paulo
    ports:
      - "8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fase3net

  history-service:
    build:
      context: .
      dockerfile: history-service/Dockerfile
    container_name: fase3-history-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-history:5432/history_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SERVER_PORT: 8083
      TZ: America/Sao_Paulo
    ports:
      - "8083:8083"
    depends_on:
      postgres-history:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fase3net

volumes:
  fase3_scheduling_data:
  fase3_history_data:
  fase3_rabbitmq_data:

networks:
  fase3net:
    driver: bridge
